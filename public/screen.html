<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chuck-Lash Screen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥂</text></svg>">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="screen-body">
    <main class="screen-only">
      <div class="masthead">
        <div>
          <h1>Chuck-Lash<span>.</span></h1>
        </div>
        <div id="screenMastRight" class="mast-meta"></div>
      </div>

      <div id="screenStage" class="stage"></div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="/screen.js"></script>

    <!-- TV CONTROLS — keep for party -->
    <button id="fsBtn" onclick="enterFullscreen()" title="Press F to fullscreen" style="
      position: fixed; bottom: 20px; right: 20px; z-index: 9998;
      display: flex; align-items: center; gap: 8px;
      background: var(--clay); color: #f3ece0;
      border: none; padding: 10px 18px; cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; font-weight: 800; letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
      transition: opacity 0.4s;
    ">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M1 5V1h4M11 1h4v4M1 11v4h4M15 11v4h-4"/>
      </svg>
      Fullscreen
    </button>
    <script>
      function enterFullscreen() {
        document.documentElement.requestFullscreen().catch(() => {});
      }
      function exitFs() {
        if (document.fullscreenElement) document.exitFullscreen();
      }

      document.addEventListener("keydown", e => {
        if (e.key === "f" || e.key === "F") {
          document.fullscreenElement ? exitFs() : enterFullscreen();
        }
        if (e.key === "Escape" && document.fullscreenElement) exitFs();
      });

      document.addEventListener("fullscreenchange", () => {
        const btn = document.getElementById("fsBtn");
        if (btn) btn.style.opacity = document.fullscreenElement ? "0" : "1";
      });

      // Auto-hide cursor after 3 s of mouse inactivity
      let _cursorTimer;
      document.addEventListener("mousemove", () => {
        document.body.style.cursor = "";
        clearTimeout(_cursorTimer);
        _cursorTimer = setTimeout(() => { document.body.style.cursor = "none"; }, 3000);
      });
    </script>

  </body>
</html>
