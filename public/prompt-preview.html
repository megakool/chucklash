<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prompt Preview — Chuck-Lash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <style>
      .preview-badge {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 999;
        padding: 6px 14px;
        background: rgba(181,74,31,0.85);
        color: #f3ece0;
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        backdrop-filter: blur(4px);
      }
    </style>
  </head>
  <body class="screen-body">
    <main class="screen-only">
      <div class="masthead">
        <div>
          <h1>Chuck-Lash<span>.</span></h1>
        </div>
        <div class="mast-meta">
          <p class="eyebrow">Tonight, in honor of</p>
          <div class="mast-honoree">Charles "Chuck" Rollins</div>
        </div>
      </div>
      <div id="screenStage" class="stage"></div>
    </main>

    <div class="preview-badge">Preview</div>

    <script>
      const params = new URLSearchParams(location.search);
      const text     = params.get("text")     || "";
      const videoUrl = params.get("videoUrl") || "";
      const stage    = document.getElementById("screenStage");

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c =>
          ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":'&#039;' }[c]));
      }

      function embedUrl(url) {
        try {
          const p = new URL(url);
          if (p.hostname.includes("youtube.com")) {
            const id = p.searchParams.get("v");
            if (id) return { type:"iframe", url:`https://www.youtube.com/embed/${id}?autoplay=1&rel=0` };
          }
          if (p.hostname === "youtu.be") {
            return { type:"iframe", url:`https://www.youtube.com/embed/${p.pathname.slice(1)}?autoplay=1&rel=0` };
          }
          if (p.hostname.includes("drive.google.com")) {
            const m = url.match(/\/d\/([^/]+)/);
            if (m) return { type:"iframe", url:`https://drive.google.com/file/d/${m[1]}/preview` };
          }
        } catch {}
        return { type:"video", url };
      }

      if (videoUrl) {
        const embed = embedUrl(videoUrl);
        const media = embed.type === "iframe"
          ? `<iframe src="${escapeHtml(embed.url)}" allow="autoplay; fullscreen" allowfullscreen></iframe>`
          : `<video src="${escapeHtml(embed.url)}" controls autoplay playsinline></video>`;
        stage.innerHTML = `<div class="video-state"><div class="video-frame">${media}</div></div>`;
      } else if (text) {
        stage.innerHTML = `<div class="text-prompt-state"><h2>${escapeHtml(text)}</h2></div>`;
      } else {
        stage.innerHTML = `<div class="text-prompt-state"><h2 style="opacity:0.3">No prompt text.</h2></div>`;
      }
    </script>
  </body>
</html>
