<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chuck-Lash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥂</text></svg>">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="phone-body">
    <div class="phone-shell">

      <header class="p-nav">
        <span class="p-nav__title">Chuck-Lash</span>
      </header>

      <!-- Join screen -->
      <section id="joinCard" class="p-join">
        <div class="p-join__hero">
          <p class="p-kicker">You're invited</p>
          <h1 class="p-join__heading">Join<br><em>the game.</em></h1>
          <p class="p-join__flavor">Enter your name to jump in.</p>
        </div>
        <form id="joinForm" class="p-join__form">
          <div class="p-field">
            <label for="nameInput">Display name</label>
            <input id="nameInput" autocomplete="name" maxlength="32" placeholder="e.g. Mike D">
          </div>
          <button type="submit" class="p-primary-btn">Enter the Game</button>
        </form>
      </section>

      <!-- Game screen -->
      <section id="gameCard" class="p-game hidden">

        <div id="status"></div>

        <!-- Answer form -->
        <form id="answerForm" class="p-answer-form hidden">
          <div class="p-field">
            <label for="answerInput">Your answer</label>
            <textarea id="answerInput" maxlength="240" rows="4" placeholder="Write something they'll remember…"></textarea>
          </div>
          <div class="p-answer-actions">
            <span class="p-char-count" id="charCount">0 / 240</span>
            <button type="submit" class="p-primary-btn p-primary-btn--auto">Submit Answer</button>
          </div>
        </form>

        <!-- Vote list -->
        <div id="voteForm" class="p-vote-form hidden">
          <div id="voteList" class="p-vote-list"></div>
        </div>

      </section>
    </div>
    <script src="/player.js"></script>
  </body>
</html>
